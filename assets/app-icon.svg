<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- 底：圆角方块 -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" fill="url(#tile)"/>

  <!-- 信封背板（露出一圈口部内衬） -->
  <rect x="196" y="448" width="632" height="368" rx="44" fill="#e0e7ff"/>

  <!-- 小马：侧面轮廓（面朝右），下巴与脖颈没入信封 -->
  <g transform="rotate(-4 512 430)">
    <!-- 头 + 颈 轮廓 -->
    <path d="M 415 292
             C 462 252 522 250 566 276
             C 600 296 622 330 630 366
             C 636 392 642 414 656 432
             C 668 446 678 458 680 470
             C 682 484 674 496 660 500
             C 644 505 622 504 604 500
             C 580 495 560 496 542 502
             C 520 510 505 520 496 534
             C 490 544 486 556 484 572
             L 484 590 L 396 590
             C 392 556 390 522 391 490
             C 393 434 396 380 415 292 Z" fill="#fbbf24"/>
    <!-- 鼻孔 -->
    <ellipse cx="650" cy="468" rx="9" ry="13" transform="rotate(-18 650 468)" fill="#d97706"/>
    <!-- 眼睛（带高光） -->
    <circle cx="582" cy="372" r="19" fill="#312e81"/>
    <circle cx="588" cy="365" r="6" fill="#ffffff"/>
    <!-- 鬃毛：沿颈背流下，外缘波浪（内侧与头部实贴） -->
    <path d="M 442 268
             C 410 290 386 340 374 396
             C 364 442 360 490 366 530
             C 388 518 400 494 392 472
             C 384 452 396 428 410 412
             C 422 398 424 374 416 354
             C 408 334 414 310 428 298
             C 436 290 441 276 442 268 Z" fill="#f59e0b"/>
    <!-- 耳朵（尖立） -->
    <path d="M 436 276 C 440 232 452 200 472 190 C 490 208 496 244 492 284 Z" fill="#fbbf24"/>
    <path d="M 508 280 C 514 232 528 198 550 188 C 568 208 574 246 570 286 Z" fill="#fbbf24"/>
    <!-- 额发：在耳间搭过额头 -->
    <path d="M 452 288 C 462 254 490 232 522 234 C 542 236 552 250 548 264
             C 528 256 508 260 492 272 C 480 281 464 290 452 288 Z" fill="#f59e0b"/>
    <!-- 前蹄：扒在信封前脸上沿 -->
    <rect x="420" y="445" width="62" height="100" rx="29" fill="#f59e0b"/>
  </g>

  <!-- 信封前脸（盖住小马下巴与脖颈） -->
  <path d="M 196 508 L 828 508 L 828 772 Q 828 816 784 816 L 240 816 Q 196 816 196 772 Z" fill="#ffffff"/>
  <!-- 信封折角 V -->
  <path d="M 220 524 L 512 668 L 804 524" fill="none" stroke="#a5b4fc" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 底部两道短折线 -->
  <path d="M 224 790 L 320 694 M 800 790 L 704 694" fill="none" stroke="#dbe3ff" stroke-width="26" stroke-linecap="round"/>
</svg>
